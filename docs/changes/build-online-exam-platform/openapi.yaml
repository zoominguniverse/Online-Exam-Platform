openapi: 3.1.0
info:
  title: Online Exam Platform
  version: 0.3.0
  description: 当前交付范围：管理端、学生 Web 和 Java API。所有个人接口仅接受 HttpOnly Web 会话 Cookie，所有写入校验 CSRF；不接受 Authorization/Bearer
    认证。响应包含code/message/data/requestId，JSON上限2MiB；未知查询字段拒绝，图片no-store。
servers:
  - url: /api/v1
paths:
  /version:
    get:
      operationId: version
      responses:
        "200":
          description: API 版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          apiVersion:
                            type: string
                            const: v1
  /catalog/grades:
    get:
      operationId: grades
      responses:
        "200":
          description: 已启用的年级目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - name
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
        "503":
          $ref: "#/components/responses/Error"
  /auth/csrf:
    get:
      operationId: csrfToken
      responses:
        "200":
          description: 返回 CSRF 请求头名称与值，并下发同源安全 Cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required:
                          - headerName
                          - token
                        properties:
                          headerName:
                            type: string
                            const: X-XSRF-TOKEN
                          token:
                            type: string
  /auth/register:
    post:
      operationId: registerStudent
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRegistration"
      responses:
        "201":
          $ref: "#/components/responses/Account"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: loginWeb
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: 已登录并下发 Web 会话 Cookie
          headers:
            Set-Cookie:
              description: __Host-exam_session; Path=/; HttpOnly; Secure; SameSite=Lax
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logoutWeb
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: currentAccount
      security:
        - webSession: []
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changePassword
      security:
        - webSession: []
      description: Web 请求须提供 CSRF 请求头。成功后撤销 全部 Web 会话及历史凭据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  $ref: "#/components/schemas/Password"
                newPassword:
                  $ref: "#/components/schemas/Password"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /me/papers:
    get:
      operationId: listVisiblePapers
      security:
        - webSession: []
      description: 仅返回当前启用学生所属年级的已发布、未归档固定卷和时段卷元信息；任务卷经任务入口读取。状态取服务端时钟，开放区间左闭右开。此接口不授予开始资格。
      parameters:
        - in: query
          name: type
          description: TASK 查询始终返回空列表
          schema:
            type: string
            enum:
              - FIXED
              - TIMED
              - TASK
        - in: query
          name: status
          schema:
            type: string
            enum:
              - OPEN
              - UPCOMING
              - CLOSED
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 按名称和 UUID 稳定排序的分页元信息，含 items、total、page、pageSize；每项含
            id、subjectId、type、name、durationMinutes、opensAt、closesAt、status、serverNow
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /me/papers/{id}:
    get:
      operationId: visiblePaperDetail
      security:
        - webSession: []
      description: 返回本人可见的普通卷元信息；不包含题目、答案或解析。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 试卷元信息，字段同列表项
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /me/papers/{id}/attempts:
    post:
      operationId: startOrdinaryAttempt
      security:
        - webSession: []
      description: 固定卷与时段卷每次新请求创建独立答卷。相同学生与幂等键在 24 小时内返回同一答卷，同键换卷返回冲突。Web 请求须提供 CSRF。时段卷使用服务端左闭右开区间，截止为开始加时长与开放结束时间的较早值。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "201":
          $ref: "#/components/responses/Attempt"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/attempts/{id}:
    get:
      operationId: readOwnAttempt
      security:
        - webSession: []
      description: 按答卷标识读取本人的冻结题目快照、截止时间、当前版本与已保存答案。取得行锁后若到期，同一事务按已确认答案冻结、客观计分并返回终态，截止不延长。该 GET 有到期补处理效果。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Attempt"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /me/attempts/{id}/answers:
    put:
      operationId: replaceOwnAnswers
      security:
        - webSession: []
      description: 整份替换答卷已保存答案。未列题目与 answer:null 均清空；只有未截止且 IN_PROGRESS 可写。Web 请求须提供 CSRF。旧 expectedVersion 返回
        VERSION_CONFLICT。到期时先持久化已确认答案的冻结，再以 EXAM_CLOSED 拒绝迟到载荷；错误响应不会回滚冻结。客户端随后读取终态。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedVersion
                - answerItems
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                answerItems:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - questionId
                      - answer
                    properties:
                      questionId:
                        type: string
                        format: uuid
                      answer:
                        description: null 清空；单选与判断用 optionId，多选用 optionIds，填空用 texts，简答用 text。具体题型按答卷快照校验。
                        oneOf:
                          - type: "null"
                          - type: object
      responses:
        "200":
          $ref: "#/components/responses/Attempt"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/attempts/{id}/submit:
    post:
      operationId: submitOwnAttempt
      security:
        - webSession: []
      description: Web 请求须提供 CSRF。截止前在同一事务校验版本与整份答案、全量保存、冻结、客观计分；纯客观卷直接 COMPLETED 并写错题，混合卷 WAIT_SELF_GRADE，主观分数与最终总分为 null。
        取得账号和答卷行锁后采样服务端时钟，截止时刻及之后仅冻结此前已确认答案，迟到 answerItems 不补写，返回 HTTP 200 的既有冻结结果。 幂等键按账号与提交动作隔离，24
        小时内同键同载荷返回原结果，同键异答卷或异载荷为 VERSION_CONFLICT。摘要规范化 JSON 对象字段顺序，数组顺序保留。 新键或过期键重试已冻结答卷也返回原冻结答案，不再计分。读、保存和每 5
        秒截止调度共用冻结逻辑；响应始终不含参考答案与解析，主观批改接口尚未实现。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerSet"
      responses:
        "200":
          $ref: "#/components/responses/Attempt"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /me/tasks/{taskId}/papers/{paperId}/attempts:
    post:
      operationId: startOrResumeTaskAttempt
      security:
        - webSession: []
      description: 冻结成员首次开始或恢复同一任务卷答卷。首次开始要求任务已发布、卷已关联且未归档，使用任务冻结的卷版本。已有答卷在任务或卷归档后仍可恢复，开始时间、快照及截止时间不变。Web 请求须提供
        CSRF；同一学生同一任务卷只有一份答卷。
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: paperId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "201":
          $ref: "#/components/responses/Attempt"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/users:
    get:
      operationId: listAccounts
      security:
        - webSession: []
      parameters:
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/Role"
        - in: query
          name: gradeId
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - createdAt
              - username
            default: createdAt
      responses:
        "200":
          description: 账号分页列表，已删除账号不出现在列表中
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        required:
                          - items
                          - total
                          - page
                          - pageSize
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Account"
                          total:
                            type: integer
                          page:
                            type: integer
                          pageSize:
                            type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createManagedAccount
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - username
                - password
                - role
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                gradeId:
                  $ref: "#/components/schemas/GradeId"
      responses:
        "201":
          $ref: "#/components/responses/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: accountDetail
      security:
        - webSession: []
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: editAccount
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - username
                - role
                - expectedVersion
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                role:
                  $ref: "#/components/schemas/Role"
                gradeId:
                  $ref: "#/components/schemas/GradeId"
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        $ref: "#/components/requestBodies/AccountVersion"
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/users/{id}/enable:
    post:
      operationId: enableAccount
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        $ref: "#/components/requestBodies/AccountVersion"
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/users/{id}/disable:
    post:
      operationId: disableAccount
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        $ref: "#/components/requestBodies/AccountVersion"
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/subjects:
    get:
      operationId: listSubject
      summary: listSubject
      security:
        - webSession: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: gradeId
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SubjectPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createSubject
      summary: createSubject
      security:
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gradeId:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - gradeId
                - name
              additionalProperties: false
  /admin/subjects/{id}:
    get:
      operationId: getSubject
      summary: getSubject
      security:
        - webSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    patch:
      operationId: editSubject
      summary: editSubject
      security:
        - webSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
