components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: __Host-exam_session
  parameters:
    Csrf:
      in: header
      name: X-XSRF-TOKEN
      required: true
      description: 使用 /auth/csrf 返回的值，并携带响应设置的 Cookie
      schema:
        type: string
    AccountId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    AccountVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - expectedVersion
            additionalProperties: false
            properties:
              expectedVersion:
                type: integer
                minimum: 1
  responses:
    Attempt:
      description: 本人答卷安全视图，题目不包含参考答案、解析或答案附件
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data:
                    $ref: "#/components/schemas/Attempt"
    Account:
      description: 安全账号视图
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountEnvelope"
    Empty:
      description: 操作成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data:
                    type: "null"
    Error:
      description: 业务错误
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  code:
                    enum:
                      - VALIDATION_ERROR
                      - UNAUTHENTICATED
                      - FORBIDDEN
                      - NOT_FOUND
                      - VERSION_CONFLICT
                      - PAPER_NOT_OPEN
                      - EXAM_CLOSED
                      - RATE_LIMITED
                      - DEPENDENCY_UNAVAILABLE
                  data:
                    type: "null"
  schemas:
    AnswerSet:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - answerItems
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        answerItems:
          type: array
          description: 全量答案，遗漏题目或 answer:null 清空；整份 JSON 最多 2 MiB，按快照校验五题型。未截止时非法内容整体拒绝。
          items:
            type: object
            additionalProperties: false
            required:
              - questionId
              - answer
            properties:
              questionId:
                type: string
                format: uuid
              answer:
                type:
                  - object
                  - "null"
    Attempt:
      type: object
      required:
        - id
        - paperId
        - paperVersionId
        - status
        - serverNow
        - deadlineAt
        - version
        - questions
        - savedAnswers
        - frozenAt
        - freezeReason
        - automaticScore
        - finalScore
        - questionScores
      properties:
        id:
          type: string
          format: uuid
        paperId:
          type: string
          format: uuid
        paperVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - IN_PROGRESS
            - WAIT_SELF_GRADE
            - COMPLETED
        serverNow:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        version:
          type: integer
        frozenAt:
          type:
            - string
            - "null"
          format: date-time
          description: 实际持久化冻结时刻；作答中为 null，原 deadlineAt 保持不变
        freezeReason:
          type:
            - string
            - "null"
          enum:
            - MANUAL
            - DEADLINE
            - null
        automaticScore:
          type:
            - string
            - "null"
          description: 冻结后客观题总分，两位小数；作答中为 null
        finalScore:
          type:
            - string
            - "null"
          description: 纯客观卷冻结后最终总分；混合卷待批改时为 null
        questionScores:
          type: array
          description: 作答中为空；冻结后客观分数固定，主观待批改为 null，不含参考答案
          items:
            type: object
            required:
              - questionId
              - score
            properties:
              questionId:
                type: string
                format: uuid
              score:
                type:
                  - string
                  - "null"
        savedAnswers:
          type: array
          items:
            type: object
            required:
              - questionId
              - answer
            properties:
              questionId:
                type: string
                format: uuid
              answer:
                type: object
        questions:
          type: array
          items:
            type: object
            required:
              - position
              - groupPosition
              - groupName
              - questionId
              - questionVersion
              - score
              - type
              - stemHtml
              - options
            properties:
              position:
                type: integer
              groupPosition:
                type: integer
              groupName:
                type: string
              questionId:
                type: string
                format: uuid
              questionVersion:
                type: integer
              score:
                type: string
              type:
                type: string
                enum:
                  - SINGLE
                  - MULTIPLE
                  - TRUE_FALSE
                  - GAP
                  - SHORT
              stemHtml:
                type: string
              options:
                type: array
                items:
                  type: object
    Envelope:
      type: object
      required:
        - code
        - message
        - data
        - requestId
      properties:
        code:
          type:
            - integer
            - string
        message:
          type: string
        data: {}
        requestId:
          type: string
          format: uuid
    AccountEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              $ref: "#/components/schemas/Account"
    Account:
      type: object
      required:
        - id
        - username
        - role
        - status
        - gradeId
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
            - DELETED
        gradeId:
          $ref: "#/components/schemas/GradeId"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    Credentials:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
    StudentRegistration:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - gradeId
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        gradeId:
          type: string
          format: uuid
    Username:
      type: string
      description: 规范化后 3–32 位英文字母、数字、下划线、点或连字符
    Password:
      type: string
      format: password
      description: 12–72 个 UTF-8 字节
    Role:
      type: string
      enum:
        - STUDENT
        - ADMIN
    GradeId:
      type:
        - string
        - "null"
      format: uuid
      description: 学生必填，管理员为空
    Score:
      type: string
      pattern: ^[0-9]+\.[0-9]{2}$
    Revision:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - expectedVersion
      additionalProperties: false
    Subject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gradeId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - gradeId
        - name
        - version
        - createdAt
      additionalProperties: false
    Option:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
      required:
        - id
        - text
      additionalProperties: false
    ReferenceAnswer:
      type: object
      properties:
        optionIds:
          type:
            - array
            - "null"
          items:
            type: string
        gaps:
          type:
            - array
            - "null"
          items:
            type: string
        text:
          type:
            - string
            - "null"
    QuestionType:
      type: string
      enum:
        - SINGLE
        - MULTIPLE
        - TRUE_FALSE
        - GAP
        - SHORT
    QuestionDraft:
      type: object
      properties:
        subjectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/QuestionType"
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        score:
          $ref: "#/components/schemas/Score"
        stemHtml:
          type: string
          maxLength: 10000
        options:
          type: array
          items:
            $ref: "#/components/schemas/Option"
        answer:
          $ref: "#/components/schemas/ReferenceAnswer"
        explanationHtml:
          type:
            - string
            - "null"
          maxLength: 10000
      required:
        - subjectId
        - type
        - difficulty
        - score
        - stemHtml
        - answer
      additionalProperties: false
    QuestionVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        subjectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/QuestionType"
        difficulty:
