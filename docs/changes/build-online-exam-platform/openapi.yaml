        explanationHtml:
          type:
            - string
            - "null"
          maxLength: 10000
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - version
        - subjectId
        - type
        - difficulty
        - score
        - stemHtml
        - options
