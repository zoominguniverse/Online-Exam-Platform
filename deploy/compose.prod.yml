x-api-environment: &api-environment
  DATABASE_URL: jdbc:postgresql://db:5432/exam_platform
  DATABASE_USER: exam_app
  DATABASE_PASSWORD: ${EXAM_APP_PASSWORD:?Set EXAM_APP_PASSWORD}
  PRIVATE_STORAGE_ROOT: /var/lib/exam-platform/attachments
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70

services:
  db:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_platform
      POSTGRES_USER: exam_migrator
      POSTGRES_PASSWORD: ${EXAM_MIGRATION_PASSWORD:?Set EXAM_MIGRATION_PASSWORD}
      DATABASE_APP_PASSWORD: ${EXAM_APP_PASSWORD:?Set EXAM_APP_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-init-app-role.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, exam_migrator, -d, exam_platform]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
  migrate:
    image: ${EXAM_GREEN_IMAGE:?Set EXAM_GREEN_IMAGE}
    command: [--migrate]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/exam_platform
      DATABASE_USER: exam_migrator
      DATABASE_PASSWORD: ${EXAM_MIGRATION_PASSWORD:?Set EXAM_MIGRATION_PASSWORD}
      BOOTSTRAP_ADMIN_USERNAME: ${EXAM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${EXAM_BOOTSTRAP_ADMIN_PASSWORD:?Set EXAM_BOOTSTRAP_ADMIN_PASSWORD}
      EXAM_SEED_DEV_GRADE: ${EXAM_SEED_DEV_GRADE:-false}
    depends_on:
      db: { condition: service_healthy }
  api-blue:
    image: ${EXAM_BLUE_IMAGE:?Set EXAM_BLUE_IMAGE}
    restart: unless-stopped
    stop_grace_period: 40s
    environment: *api-environment
    volumes: [attachments:/var/lib/exam-platform/attachments]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
  api-green:
    image: ${EXAM_GREEN_IMAGE:?Set EXAM_GREEN_IMAGE}
    restart: unless-stopped
    stop_grace_period: 40s
    environment: *api-environment
    volumes: [attachments:/var/lib/exam-platform/attachments]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
  web:
    image: ${EXAM_WEB_IMAGE:?Set EXAM_WEB_IMAGE}
    restart: unless-stopped
    environment:
      EXAM_UPSTREAM: ${EXAM_ACTIVE_API:-api-blue}:8080
    volumes: [routing:/var/lib/exam-routing]
    ports: ['127.0.0.1:${EXAM_WEB_PORT:-8080}:80']
    depends_on: [api-blue]
volumes:
  database:
  attachments:
  routing:
